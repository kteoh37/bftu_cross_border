name: Build JSON

on:
  push:
    paths:
      - "excel_files/**"
      - "scripts/xlsx_to_json.py"
      - ".github/workflows/build-json.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas openpyxl

      - run: python scripts/xlsx_to_json.py

      - name: Commit JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/json
          if git diff --cached --quiet; then
            echo "no JSON changes"
          else
            git commit -m "chore: rebuild JSON from xlsx"
            git push
          fi
